<svg xmlns="http://www.w3.org/2000/svg" viewBox="22 22 468 468">
<defs>
  <!-- The inner field stays transparent, so the avatar fills it with its own background -->
  <mask id="field">
    <rect x="0" y="0" width="512" height="512" fill="#fff"/>
    <circle cx="256" cy="256" r="161" fill="#000"/>
  </mask>
  <clipPath id="chip"><circle cx="256" cy="256" r="228"/></clipPath>
  <filter id="grime" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="3" seed="11"/>
    <feColorMatrix values="0 0 0 0 0.03  0 0 0 0 0.04  0 0 0 0 0.03  0 0 0 2.2 -1.1"/>
    <feComposite in2="SourceGraphic" operator="in"/>
  </filter>
  <filter id="speckle" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.7" numOctaves="1" seed="4"/>
    <feColorMatrix values="0 0 0 0 0.02  0 0 0 0 0.03  0 0 0 0 0.02  0 0 0 9 -6.2"/>
    <feComposite in2="SourceGraphic" operator="in"/>
  </filter>
  <radialGradient id="rimWeight" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0.55" stop-color="#fff" stop-opacity="0.25"/><stop offset="1" stop-color="#fff"/>
  </radialGradient>
</defs>
<g transform="rotate(-10 256 256)" mask="url(#field)">
  <!-- The logo's chip rim without the bites -->
  <circle cx="256" cy="256" r="228" fill="#0e5527"/>
  <g clip-path="url(#chip)">
    <circle cx="236" cy="232" r="214" fill="#16873f"/>
    <circle cx="256" cy="256" r="228" fill="none" stroke="#f7c46c" stroke-width="10" stroke-dasharray="300 1200" stroke-dashoffset="-900" opacity="0.8"/>
    <rect x="233" y="26" width="46" height="70" rx="8" fill="#eee3c8" stroke="#0b0e0c" stroke-width="8" transform="rotate(22.5 256 256)"/><rect x="231" y="26" width="50" height="70" rx="8" fill="#eee3c8" stroke="#0b0e0c" stroke-width="8" transform="rotate(67.5 256 256)"/><rect x="229" y="26" width="54" height="70" rx="8" fill="#eee3c8" stroke="#0b0e0c" stroke-width="8" transform="rotate(112.5 256 256)"/><rect x="232" y="26" width="48" height="70" rx="8" fill="#eee3c8" stroke="#0b0e0c" stroke-width="8" transform="rotate(157.5 256 256)"/><rect x="230" y="26" width="52" height="70" rx="8" fill="#eee3c8" stroke="#0b0e0c" stroke-width="8" transform="rotate(202.5 256 256)"/><rect x="233" y="26" width="46" height="70" rx="8" fill="#eee3c8" stroke="#0b0e0c" stroke-width="8" transform="rotate(247.5 256 256)"/><rect x="231" y="26" width="50" height="70" rx="8" fill="#eee3c8" stroke="#0b0e0c" stroke-width="8" transform="rotate(292.5 256 256)"/><rect x="229" y="26" width="54" height="70" rx="8" fill="#eee3c8" stroke="#0b0e0c" stroke-width="8" transform="rotate(337.5 256 256)"/>
    <path d="M150 120 L188 104" stroke="#7fd39b" stroke-width="4" stroke-linecap="round" opacity="0.55"/><path d="M372 360 L410 330" stroke="#7fd39b" stroke-width="4" stroke-linecap="round" opacity="0.55"/><path d="M120 300 L132 340" stroke="#7fd39b" stroke-width="4" stroke-linecap="round" opacity="0.55"/><path d="M210 440 L250 446" stroke="#7fd39b" stroke-width="4" stroke-linecap="round" opacity="0.55"/>
  </g>
  <circle cx="256" cy="256" r="166" fill="none" stroke="#0b0e0c" stroke-width="10"/>
  <!-- Dirt over everything, then the outline on top -->
  <circle cx="256" cy="256" r="228" fill="url(#rimWeight)" filter="url(#grime)" opacity="0.75"/>
  <circle cx="256" cy="256" r="228" fill="url(#rimWeight)" filter="url(#speckle)"/>
  <circle cx="256" cy="256" r="228" fill="none" stroke="#0b0e0c" stroke-width="12"/>
</g>
</svg>
